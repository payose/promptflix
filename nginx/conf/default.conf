# -------------------------------
# HTTP → HTTPS redirect
# -------------------------------
server {
    listen 80;
    server_name findsmovies.com www.findsmovies.com;

    # ACME challenge (keep for renewals)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------
# HTTPS server
# -------------------------------
server {
    listen 443 ssl http2;
    server_name findsmovies.com www.findsmovies.com;

    # SSL certs
    ssl_certificate /etc/letsencrypt/live/findsmovies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/findsmovies.com/privkey.pem;

    # Basic hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # API
    location /api/ {
        proxy_pass http://findsmovies-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Frontend
    location / {
        proxy_pass http://findsmovies-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
