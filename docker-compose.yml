version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: promptflix-db
    environment:
      POSTGRES_USER: promptflix
      POSTGRES_PASSWORD: promptflix_dev
      POSTGRES_DB: promptflix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: promptflix-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app  # hot reload (dev)
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://promptflix:promptflix_dev@db:5432/promptflix
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: promptflix-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
