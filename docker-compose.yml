services:
  postgres:
    image: postgres:15-alpine
    container_name: findsmovies-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - findsmovies
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: findsmovies-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - findsmovies

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: findsmovies-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - findsmovies

  nginx:
    image: nginx:alpine
    container_name: findsmovies-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - findsmovies

volumes:
  postgres_data:

networks:
  findsmovies:
    driver: bridge
